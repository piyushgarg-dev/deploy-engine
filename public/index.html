<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deploy Engine</title>
    <style>
      :root {
        --bg: #0a0c10;
        --bg-elev: #12151c;
        --bg-input: #0d1017;
        --border: #1f242e;
        --border-focus: #3b82f6;
        --text: #e6e9ef;
        --text-dim: #8b94a3;
        --text-faint: #5a6372;
        --accent: #3b82f6;
        --accent-hover: #2f6fe0;
        --success: #22c55e;
        --success-bg: rgba(34, 197, 94, 0.1);
        --error: #ef4444;
        --error-bg: rgba(239, 68, 68, 0.1);
        --radius: 12px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background-image: radial-gradient(
            circle at 20% 0%,
            rgba(59, 130, 246, 0.08),
            transparent 40%
          ),
          radial-gradient(
            circle at 80% 100%,
            rgba(34, 197, 94, 0.06),
            transparent 40%
          );
      }

      .card {
        width: 100%;
        max-width: 460px;
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 32px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 6px;
      }

      .brand-icon {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), #6366f1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        flex-shrink: 0;
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .subtitle {
        color: var(--text-dim);
        font-size: 14px;
        margin-bottom: 28px;
        margin-top: 4px;
      }

      .field {
        margin-bottom: 18px;
      }

      label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-dim);
        margin-bottom: 8px;
      }

      input {
        width: 100%;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 12px 14px;
        color: var(--text);
        font-size: 14px;
        font-family: "SF Mono", ui-monospace, Menlo, monospace;
        transition: border-color 0.15s, box-shadow 0.15s;
      }

      input::placeholder {
        color: var(--text-faint);
      }

      input:focus {
        outline: none;
        border-color: var(--border-focus);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      }

      button {
        width: 100%;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 9px;
        padding: 13px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 6px;
        transition: background 0.15s, transform 0.05s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      button:hover:not(:disabled) {
        background: var(--accent-hover);
      }

      button:active:not(:disabled) {
        transform: translateY(1px);
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .result {
        margin-top: 24px;
        border-radius: 10px;
        padding: 16px;
        font-size: 14px;
        display: none;
        animation: fade 0.25s ease;
      }

      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .result.success {
        display: block;
        background: var(--success-bg);
        border: 1px solid rgba(34, 197, 94, 0.3);
      }

      .result.error {
        display: block;
        background: var(--error-bg);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #fca5a5;
      }

      .result-title {
        font-weight: 600;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .result.success .result-title {
        color: var(--success);
      }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 8px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }

      .row:first-of-type {
        border-top: none;
      }

      .row .key {
        color: var(--text-dim);
        font-size: 13px;
      }

      .row .val {
        font-family: "SF Mono", ui-monospace, Menlo, monospace;
        font-size: 13px;
        color: var(--text);
        word-break: break-all;
        text-align: right;
      }

      .row .val a {
        color: var(--accent);
        text-decoration: none;
      }

      .row .val a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <div class="brand-icon">&#128230;</div>
        <h1>Deploy Engine</h1>
      </div>
      <p class="subtitle">Spin up a container from any Docker image.</p>

      <form id="deploy-form">
        <div class="field">
          <label for="image">Image</label>
          <input
            id="image"
            name="image"
            type="text"
            placeholder="nginx"
            autocomplete="off"
            required
          />
        </div>
        <div class="field">
          <label for="tag">Tag</label>
          <input
            id="tag"
            name="tag"
            type="text"
            placeholder="latest"
            value="latest"
            autocomplete="off"
            required
          />
        </div>
        <button type="submit" id="submit-btn">Deploy Container</button>
      </form>

      <div class="result" id="result"></div>
    </div>

    <script>
      const form = document.getElementById("deploy-form");
      const btn = document.getElementById("submit-btn");
      const result = document.getElementById("result");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const image = document.getElementById("image").value.trim();
        const tag = document.getElementById("tag").value.trim() || "latest";

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Deploying...';
        result.className = "result";

        try {
          const res = await fetch("/container", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ image, tag }),
          });

          const data = await res.json();

          if (!res.ok) {
            throw new Error(data.message || "Failed to deploy container.");
          }

          const name = data.data.containerName.replace(/^\//, "");
          const domain = data.data.domain;

          result.className = "result success";
          result.innerHTML = `
            <div class="result-title">&#10003; Container deployed</div>
            <div class="row">
              <span class="key">Name</span>
              <span class="val">${name}</span>
            </div>
            <div class="row">
              <span class="key">Domain</span>
              <span class="val"><a href="http://${domain}" target="_blank" rel="noopener">${domain}</a></span>
            </div>
          `;
        } catch (err) {
          result.className = "result error";
          result.innerHTML = `
            <div class="result-title">&#9888; Deployment failed</div>
            <div>${err.message}</div>
          `;
        } finally {
          btn.disabled = false;
          btn.textContent = "Deploy Container";
        }
      });
    </script>
  </body>
</html>
